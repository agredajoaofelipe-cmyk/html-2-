<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>listas, tabela e formularios</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>minhas compras</h1>
    <h2>lista de compras do mes</h2>
    <table class="tabela-compras">
       <thead>
        <tr>
            <th>item</th>
            <th>quantidade</th>
            <th>preco unit.</th>
            <th>subtotal</th>
        </tr>
       </thead>
       <tbody>
        <tr>
            <td>arroz</td>
            <td>2</td>
            <td>R$ 5,00</td>
            <td>R$ 10,00</td>
        </tr>
        <tr>
            <td>feijão</td>
            <td>1</td>
            <td>R$ 7,50</td>
            <td>R$ 7,50</td>
        </tr>
        <tr>
            <td>leite</td>
            <td>3</td>
            <td>R$ 4,20</td>
            <td>R$ 12,60</td>
        </tr>
       </tbody>
       <tfoot>
        <tr>
            <td colspan="3">total</td>
            <td>R$ 30,10</td>
        </tr>
       </tfoot>
    </table>
</body>
</html>
